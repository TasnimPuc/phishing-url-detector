<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Warning: possible phishing site</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #d93025; color: #fff; margin: 0; }
  main { max-width: 640px; margin: 12vh auto; padding: 0 24px; }
  h1 { font-size: 30px; }
  code { background: rgba(0,0,0,.2); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  button { font-size: 16px; padding: 10px 16px; margin: 16px 12px 0 0; border: 0; border-radius: 6px; cursor: pointer; }
  #back { background: #fff; color: #d93025; font-weight: 700; }
  #go { background: transparent; color: #fff; border: 1px solid #fff; }
</style>
</head>
<body>
<main>
  <h1>This site may be a phishing page</h1>
  <p>PhishGuard flagged <code id="host"></code> with a phishing probability of <b id="p"></b>.</p>
  <p>Do not enter passwords, OTPs or card details here.</p>
  <button id="back">Go back to safety</button>
  <button id="go">Proceed anyway</button>
</main>
<script src="model.js"></script>
<script src="warning.js"></script>
</body>
</html>
